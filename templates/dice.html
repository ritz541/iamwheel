<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Dice Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/nes-custom.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/wheel.css') }}">
    <style>
        .dice-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 2rem;
        }
        .dice {
            width: 100px;
            height: 100px;
            background-color: white;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            margin-bottom: 1rem;
        }
        .leaderboard {
            width: 100%;
            max-width: 600px;
            margin: 2rem auto;
        }
        .player-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem;
            border-bottom: 1px solid #ddd;
        }
        .current-player {
            background-color: #f0f8ff;
            font-weight: bold;
        }
        .timer {
            font-size: 1.5rem;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    {% extends "base.html" %}
    {% block content %}
    <div class="dice-container">
        <h1>Multiplayer Dice Game</h1>
        <div class="timer">Time left: <span id="timer">10</span>s</div>
        <div class="dice" id="dice">?</div>
        <button id="roll-btn" class="nes-btn is-primary">Roll Dice</button>
        
        <div class="leaderboard">
            <h2>Leaderboard</h2>
            <div id="players-container">
                <!-- Player rows will be added dynamically -->
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/dice.js') }}"></script>
    {% endblock %}
</body>
</html>
