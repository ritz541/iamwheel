<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/nes-custom.css') }}">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="{{ url_for('static', filename='js/p5_card.js') }}"></script>
    <style>
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px auto;
            max-width: 800px;
        }
        .card {
            aspect-ratio: 1;
            min-height: 100px;
            background-color: #333;
            border: 2px solid #666;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .card.flipped {
            background-color: #fff;
            transform: rotateY(180deg);
            color: #000;
            font-size: 2rem;
        }
        .card.matched {
            visibility: hidden;
        }
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .timer, .score {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    {% extends "base.html" %}
    {% block content %}
    <h1>Card Flip Game</h1>
    <div class="game-info">
        <div class="timer">Time: <span id="time">60</span>s</div>
        <div class="score">Score: <span id="score">0</span></div>
    </div>
    <script src="{{ url_for('static', filename='js/card_game.js') }}"></script>
    <script>
        // Initialize D3.js
        const svg = d3.select("#cards")
            .append("svg")
            .attr("width", "100%")
            .attr("height", "100%");
    </script>
    {% endblock %}
</body>
</html>
