{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/wheel.css') }}">

<div class="container">
    <h1 class="text-center mb-4">Wheel Game</h1>
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card nes-container is-rounded">
                <div class="card-header nes-container">
                    <h3 class="text-center nes-text">Game Room</h3>
                </div>
                <div class="card-body nes-container">
                    <div class="text-center mb-3">
                        <p>Your Balance: ₹{{ current_user.user_data.wallet_balance }}</p>
                    </div>
                    <div class="text-center mb-3">
                        <p>Time Left: <span id="countdown">5:00</span></p>
                    </div>
                    
                    <!-- Wheel Container -->
                    <div class="wheel-container">
                        <div class="wheel"></div>
                        <div class="wheel-center"></div>
                        <div class="wheel-arrow"></div>
                    </div>

                    <!-- Game Status -->
                    <div class="game-status nes-container is-rounded mt-3 text-center">
                        Waiting for players...
                    </div>

                    <!-- Players List -->
                    <div class="mt-4">
                        <h4 class="text-center mb-3">Current Players</h4>
                        <ul class="players-list nes-list is-disc">
                            <!-- Players will be added dynamically -->
                        </ul>
                    </div>

                    <div class="text-center mt-4">
                        <button id="joinGame" class="nes-btn is-primary btn-lg">Join Game (₹10)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>



<script>


// WebSocket setup (similar to your existing game.js)
const socket = io();

socket.on('connect', () => {
    console.log('Connected to WebSocket');
    socket.emit('join_game_page'); // Notify server we are on the game page
});

socket.on('disconnect', () => {
    console.log('Disconnected from WebSocket');
});

socket.on('game_state', (state) => {
    updateGameState(state);
    updatePlayersList(state.players);
    updateCountdown(state.time_remaining);
});

socket.on('game_result', (result) => {
    console.log('Game Result:', result);
    if (result && result.winner && result.prize_pool !== undefined) { 
        showWinnerPopup(result);
    } else {
        console.error("Received incomplete game result:", result);
    }
    setTimeout(() => {
        loadGameHistory();
    }, 1000);
});

socket.on('notification', (data) => {
    showNotification(data.message, data.type || 'info');
});

// Wheel drawing logic (requires wheel.js or similar)
const wheelCanvas = document.querySelector('.wheel'); // Assuming canvas
// --- Need your wheel drawing functions here ---

function updateGameState(state) {
    const gameStatus = document.querySelector('.game-status');
    if (state.status === 'waiting') {
        gameStatus.textContent = 'Waiting for players...';
        gameStatus.className = 'game-status alert alert-info mt-3 text-center';
    } else if (state.status === 'running') {
        gameStatus.textContent = 'Game in progress!';
        gameStatus.className = 'game-status alert alert-warning mt-3 text-center';
        // Start wheel animation if needed
    } else if (state.status === 'finished') {
        gameStatus.textContent = `Game finished! Winner: ${state.winner ? state.winner.username : 'Unknown'}`;
        gameStatus.className = 'game-status alert alert-success mt-3 text-center';
    }
    
    // Enable/disable join button
    const joinButton = document.getElementById('joinGame');
    if (state.status === 'waiting') {
        joinButton.disabled = false;
        joinButton.textContent = 'Join Game (₹10)';
    } else {
        joinButton.disabled = true;
        joinButton.textContent = 'Game in Progress';
    }
}

function updatePlayersList(players) {
    const playersList = document.querySelector('.players-list');
    playersList.innerHTML = ''; // Clear previous list
    if (Object.keys(players).length === 0) {
        playersList.innerHTML = '<li class="list-group-item">No players yet</li>';
    } else {
        for (const id in players) {
            const player = players[id];
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center';
            li.innerHTML = `
                <span>${player.emoji} ${player.username}</span>
                ${player.is_turn ? '<span class="badge bg-primary rounded-pill">Spinning</span>' : ''}
            `;
            playersList.appendChild(li);
        }
    }
}

function updateCountdown(seconds) {
    const countdownElement = document.getElementById('countdown');
    const minutes = Math.floor(seconds / 60);
    const remainingSeconds = seconds % 60;
    countdownElement.textContent = `${minutes}:${remainingSeconds < 10 ? '0' : ''}${remainingSeconds}`;
}

// Join Game Button
document.getElementById('joinGame').addEventListener('click', () => {
    socket.emit('join_game');
});

// Winner Popup (accepts the whole result object now)
function showWinnerPopup(result) { 
    if (!result || !result.winner) return;

    const winner = result.winner;
    const prizeAmount = result.prize_pool; 

    // Format the prize amount as currency
    const formattedPrize = new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR'
    }).format(prizeAmount);

    const popup = document.createElement('div');
    popup.className = 'winner-popup'; // Ensure this class is styled in wheel.css
    popup.innerHTML = `
        <h2 class="title">Winner!</h2> {# Use class for styling #}
        <div class="emoji">${winner.emoji || '❓'}</div> {# Use class for styling #}
        <h3 class="player-name">${winner.username || 'Unknown'}</h3> {# Use class for styling #}
        <p class="prize">Won ${formattedPrize}!</p> {# Display formatted prize #}
        <button onclick="this.parentElement.remove()">Close</button>
    `;
    document.body.appendChild(popup);
    
    // Auto-remove popup after a delay
    setTimeout(() => popup.remove(), 6000); 
}

// Notification (example structure - adapt as needed)
function showNotification(message, type = 'info') {
    const notification = document.createElement('div');
    notification.className = `game-notification alert alert-${type}`;
    notification.textContent = message;
    document.body.appendChild(notification);
    setTimeout(() => notification.remove(), 3000);
}

// Initial state update (if server sends initial state on connect)
socket.on('initial_state', (state) => {
    updateGameState(state);
    updatePlayersList(state.players);
    updateCountdown(state.time_remaining);

});

</script>
{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
<script src="{{ url_for('static', filename='js/wheel.js') }}"></script>
{% endblock %}
