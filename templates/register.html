{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h2 class="text-center">Register</h2>
            </div>
            <div class="card-body">
                <form method="POST">
    <a href="{{ url_for('google_login') }}" class="google-btn" style="display: block; width: 100%; padding: 10px; margin-bottom: 20px; background-color: #4285f4; color: white; text-align: center; text-decoration: none; border-radius: 4px;">
        <i class="fab fa-google"></i> Sign up with Google
    </a>
    <div style="text-align: center; margin: 15px 0;">- OR -</div>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone" name="phone" pattern="[0-9]{10}" title="Please enter a valid 10-digit phone number" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Choose Your Emoji</label>
                        <div class="emoji-selector">
                            <input type="text" id="selected_emoji" name="selected_emoji" class="form-control" value="🎮" readonly required>
                            <button type="button" id="emoji-button" class="btn btn-secondary">Choose Emoji</button>
                        </div>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-success">Register</button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add emoji picker script -->
<script src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.18.3/index.js" type="module"></script>
<script type="module">
    // Create and append the emoji-picker element
    const picker = document.createElement('emoji-picker');
    document.body.appendChild(picker);
    
    // Style the picker
    picker.style.position = 'absolute';
    picker.style.zIndex = '999';
    picker.style.display = 'none';
    
    // Get DOM elements
    const button = document.getElementById('emoji-button');
    const input = document.getElementById('selected_emoji');
    
    // Add event listener for emoji selection
    picker.addEventListener('emoji-click', event => {
        input.value = event.detail.unicode;
        picker.style.display = 'none';
    });
    
    // Show/hide picker on button click
    button.addEventListener('click', (e) => {
        e.preventDefault(); // Prevent form submission
        if (picker.style.display === 'none') {
            const rect = button.getBoundingClientRect();
            picker.style.top = `${rect.bottom + window.scrollY}px`;
            picker.style.left = `${rect.left + window.scrollX}px`;
            picker.style.display = 'block';
        } else {
            picker.style.display = 'none';
        }
    });
    
    // Hide picker when clicking outside
    document.addEventListener('click', (e) => {
        if (e.target !== button && !picker.contains(e.target)) {
            picker.style.display = 'none';
        }
    });
</script>

<style>
.emoji-selector {
    display: flex;
    gap: 10px;
    align-items: center;
    position: relative;
}

#selected_emoji {
    width: 60px;
    text-align: center;
    font-size: 24px;
}

emoji-picker {
    --num-columns: 8;
    --category-emoji-size: 24px;
    --emoji-size: 24px;
    --background: white;
    --border-color: #ccc;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}
</style>
{% endblock %}
