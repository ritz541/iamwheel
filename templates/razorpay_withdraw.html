{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1 class="title">Razorpay Withdrawal</h1>
    
    <div class="nes-container with-title is-centered">
        <p class="title">Withdrawal Details</p>
        <form id="withdrawForm" class="nes-field">
            <div class="nes-field">
                <label for="amount">Amount (₹)</label>
                <input type="number" id="amount" name="amount" class="nes-input" 
                       min="200" max="100000" step="100" required>
                <small class="nes-text is-error" id="amountError"></small>
            </div>
            
            <div class="nes-field">
                <label for="account_number">Account Number</label>
                <input type="text" id="account_number" name="account_number" 
                       class="nes-input" required>
            </div>
            
            <div class="nes-field">
                <label for="ifsc_code">IFSC Code</label>
                <input type="text" id="ifsc_code" name="ifsc_code" 
                       class="nes-input" required>
            </div>
            
            <div class="nes-field">
                <label for="account_holder">Account Holder Name</label>
                <input type="text" id="account_holder" name="account_holder" 
                       class="nes-input" required>
            </div>
            
            <button type="submit" class="nes-btn is-warning" id="withdrawButton">
                Request Withdrawal
            </button>
        </form>
    </div>
</div>

<script>
document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const amount = parseFloat(document.getElementById('amount').value);
    if (amount < 200 || amount > 100000) {
        document.getElementById('amountError').textContent = 'Amount must be between ₹200 and ₹100,000';
        return;
    }
    
    if (amount > {{ current_user.user_data.wallet_balance }}) {
        document.getElementById('amountError').textContent = 'Insufficient balance';
        return;
    }
    
    try {
        const formData = new FormData(e.target);
        const response = await fetch('/razorpay/withdraw', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        if (response.ok) {
            window.location.href = '/wallet?withdrawal=success';
        } else {
            document.getElementById('amountError').textContent = data.error;
        }
    } catch (error) {
        document.getElementById('amountError').textContent = 'An error occurred. Please try again.';
    }
});
</script>

<style>
.container {
    max-width: 600px;
    margin: 0 auto;
    padding: 2rem;
}

.nes-container {
    margin-top: 2rem;
}

.nes-field {
    margin-bottom: 1rem;
}

#withdrawButton {
    margin-top: 1rem;
    width: 100%;
}
</style>
{% endblock %}
