{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1 class="title">Manual Deposit</h1>
    
    <div class="nes-container with-title">
        <p class="title">Deposit Money</p>
        <form method="POST" action="{{ url_for('manual_deposit') }}">
            <div class="nes-field">
                <label for="deposit_amount">Amount (₹20 - ₹1000)</label>
                <input type="number" class="nes-input" id="deposit_amount" name="amount" 
                       min="20" max="1000" required>
            </div>
            <div class="nes-field">
                <label>Payment QR Code</label>
                <div class="text-center">
                    <img src="{{ url_for('static', filename='images/payment_qr.jpg') }}" 
                         alt="Payment QR" class="img-fluid mb-2" style="max-width: 200px;">
                </div>
                <div class="nes-text is-primary">
                    1. Scan QR and make payment<br>
                    2. Enter amount and submit request<br>
                    3. Admin will verify and update balance
                </div>
            </div>
            <button type="submit" class="nes-btn is-primary">Submit Deposit Request</button>
        </form>
    </div>
</div>

<style>
.container {
    max-width: 800px;
    margin: 0 auto;
    padding: 2rem;
}

.nes-container {
    margin-bottom: 2rem;
    padding: 1.5rem;
}

.nes-field {
    margin-bottom: 1rem;
}

.nes-btn {
    margin-top: 1rem;
    width: 100%;
}

@media (max-width: 768px) {
    .container {
        padding: 1rem;
    }
}
</style>
{% endblock %}
